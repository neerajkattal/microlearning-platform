name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck -w @microlearning/shared-types
      - run: npm run typecheck -w @microlearning/game-contracts
      - run: npm run test -w @microlearning/web
      - run: npm run build -w @microlearning/web
