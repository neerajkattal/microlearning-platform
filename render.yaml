# Render Blueprint — deploys the API and a managed Postgres. Apply via
# the Render dashboard: "New +" → "Blueprint" → connect this GitHub repo
# → Render reads this file automatically. See docs/operations/DEPLOYMENT.md
# for the full runbook, including Redis (Upstash — Render's own Redis
# isn't on the free tier, paste its URL into REDIS_URL below).
#
# No worker/cron_job service here on purpose: Render's free tier only
# allows web services — both `type: worker` and a cron job came back
# rejected ("only web services allowed for plan" / "invalid plan: free")
# when actually tried against Render's API, not assumed from docs. The
# worker's only job was calling the API's own /ingestion/opentdb
# endpoint on a schedule (ADR-0003), so .github/workflows/
# scheduled-ingestion.yml does that instead, for free, from GitHub
# Actions.
databases:
  - name: playtolearn-db
    plan: free
    databaseName: microlearning
    user: microlearning

services:
  - type: web
    name: playtolearn-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.render.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # NOT preDeployCommand: that field accepted the value (200/201) but
    # never actually took effect, confirmed by checking the service back
    # afterward — see api.render.Dockerfile's own CMD, which runs
    # `alembic upgrade head` itself on every container start instead.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: playtolearn-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://playtolearn.neerajkattal.app,https://playtolearn-five.vercel.app"
      - key: REDIS_URL
        sync: false # set manually to your Upstash Redis URL after creating it
