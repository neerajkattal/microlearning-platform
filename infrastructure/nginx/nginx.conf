# Single local entry point: browser -> nginx -> (web dev server | api).
# Strips the /api prefix so FastAPI's routes (e.g. /health) stay
# unprefixed internally; the browser always calls /api/health.

server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_set_header Host $host;
        # Vite's dev server and HMR need WebSocket upgrade support.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
